        341: "虎羊鸡猴狗牛蛇", 342: "龙牛蛇虎鼠兔羊", 343: "羊鸡猪龙狗牛马", 344: "鼠猴牛狗虎兔马", 345: "龙鼠狗牛虎鸡猪",

        356: "马蛇龙鸡鼠狗羊", 357: "羊鸡虎狗兔牛蛇", 358: "鼠兔鸡马猴猪羊", 359: "猪兔蛇牛鼠狗鸡", 360: "兔猴蛇狗牛马龙", 
        361: "龙狗鸡牛马猴兔", 362: "猪虎龙羊兔鸡狗", 363: "龙牛狗虎兔鼠猪", 364: "猪狗猴牛兔鼠蛇", 365: "羊蛇兔猴猪马虎", 
        366: "兔马鼠虎羊狗牛"
    };

    function fetchJSONP(url) {
        return fetch(url)
            .then(res => res.text())
            .then(text => {
                const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/);
                if (match && match[1]) return JSON.parse(match[1]);
                throw new Error("Không thể đọc dữ liệu");
            });
    }

    // Lấy đúng 6 con giáp đầu tiên của kỳ dự đoán
    function getPredictForKy(kyNum) {
        let actualKy = ((kyNum - 1) % 366) + 1;
        let str7 = RAW_PREDICTIONS[actualKy] || "鼠牛虎兔龙蛇";
        return str7.substring(0, 6);
    }

    function formatTwoDigits(val) {
        let cleanVal = String(val).trim();
        let num = parseInt(cleanVal.replace(/\D/g, ''), 10);
        if (isNaN(num)) return '';
        return String(num).padStart(2, '0');
    }

    function formatThreeDigits(val) {
        let num = parseInt(String(val).replace(/\D/g, ''), 10);
        if (isNaN(num)) return '001';
        return String(num).padStart(3, '0');
    }

    async function initPredict() {
        try {
            const rawKQ = await fetchJSONP(URL_KQ);
            const rowsKQ = rawKQ.table ? rawKQ.table.rows : [];

            // Kiểm tra xem bảng KQ có chứa 'x' hoặc 'X'
            let hasX = false;
            if (rowsKQ) {
                for (let r of rowsKQ) {
                    if (r.c) {
                        for (let cell of r.c) {
                            if (cell && cell.v !== null && cell.v !== undefined) {
                                if (String(cell.v).toLowerCase().includes('x')) {
                                    hasX = true;
                                    break;
                                }
                            }
                        }
                    }
                    if (hasX) break;
                }
            }

            // Đổi cột con giáp: 'x'/'X' -> Cột E (index 4), ngược lại -> Cột B (index 1)
            let animalColIndex = hasX ? 4 : 1;

            // Map số -> con giáp
            const rawRules = await fetchJSONP(URL_DULIEU);
            if (rawRules.table && rawRules.table.rows) {
                rawRules.table.rows.forEach(r => {
                    if (r.c && r.c[0] && r.c[0].v !== null && r.c[0].v !== undefined) {
                        let formattedNum = formatTwoDigits(r.c[0].v);
                        let animalCell = r.c[animalColIndex];
                        let animal = (animalCell && animalCell.v !== null && animalCell.v !== undefined) ? String(animalCell.v).trim() : '';
                        if (formattedNum && animal) {
                            duLieuMap[formattedNum] = animal;
                        }
                    }
                });
            }

            let parsedList = [];
            if (rowsKQ) {
                for (let i = 0; i < rowsKQ.length; i++) {
                    const r = rowsKQ[i].c;
                    if (!r || !r[0] || r[0].v === null || r[0].v === undefined) continue;
                    
                    let kyRaw = String(r[0].v).trim();
                    let kyOnlyNum = parseInt(kyRaw.replace(/\D/g, ''), 10) || 0;
                    
                    // Lấy tất cả các số từ Giải 1 đến Giải Đặc biệt (Cột 1 đến Cột 7)
                    let orderedColumns = [1, 2, 3, 4, 5, 6, 7];
                    let numbersInDraw = [];

                    for (let colIdx of orderedColumns) {
                        if (r[colIdx] && r[colIdx].v !== null && r[colIdx].v !== undefined) {
                            let valStr = String(r[colIdx].v).trim();
                            if (valStr !== '' && valStr !== '0' && valStr !== '00') {
                                let formatted = formatTwoDigits(valStr);
                                if (formatted) {
                                    numbersInDraw.push(formatted);
                                }
                            }
                        }
                    }

                    if (kyOnlyNum > 0) {
                        parsedList.push({
                            kyNum: kyOnlyNum,
                            drawNumbers: numbersInDraw
                        });
                    }
                }
            }

            let doneList = [];
            let pendingKyObj = null;

            for (let i = 0; i < parsedList.length; i++) {
                let item = parsedList[i];
                let isDone = item.drawNumbers && item.drawNumbers.length > 0;
                if (isDone) {
                    doneList.push(item);
                } else {
                    pendingKyObj = item;
                }
            }

            let targetPredictKy = 1;
            if (pendingKyObj) {
                targetPredictKy = pendingKyObj.kyNum;
            } else if (doneList.length > 0) {
                targetPredictKy = doneList[doneList.length - 1].kyNum + 1;
            }

            let evaluatedDoneList = [];
            for (let i = 0; i < doneList.length; i++) {
                let item = doneList[i];
                let predictedStr = getPredictForKy(item.kyNum);
                let predAnimals = predictedStr.split('');

                // Tìm các con giáp đã xuất hiện trong kết quả quay thưởng
                let hitAnimalsSet = new Set();
                for (let numStr of item.drawNumbers) {
                    let numInt = parseInt(numStr, 10);
                    if (numInt >= 1 && numInt <= 49) {
                        let mappedAnimal = duLieuMap[numStr] || '';
                        if (predAnimals.includes(mappedAnimal)) {
                            hitAnimalsSet.add(mappedAnimal);
                        }
                    }
                }

                let winCount = hitAnimalsSet.size;
                let isWin = winCount > 0;
                
                evaluatedDoneList.push({ item, isWin, predictedStr, hitAnimalsSet, winCount });
            }

            // Đếm số kỳ trượt liên tiếp gần nhất
            let checkLatestMisses = 0;
            for (let i = evaluatedDoneList.length - 1; i >= 0; i--) {
                if (!evaluatedDoneList[i].isWin) {
                    checkLatestMisses++;
                } else {
                    break;
                }
            }

            let cutoffIndex = 0;
            if (checkLatestMisses < 3) {
                let consecutiveMisses = 0;
                for (let i = evaluatedDoneList.length - 1; i >= 0; i--) {
                    if (!evaluatedDoneList[i].isWin) {
                        consecutiveMisses++;
                        if (consecutiveMisses >= 3) {
                            cutoffIndex = i + 1;
                            break;
                        }
                    } else {
                        consecutiveMisses = 0;
                    }
                }
            } else {
                cutoffIndex = evaluatedDoneList.length;
            }

            let nextKyNum = targetPredictKy;
            let predictNext = getPredictForKy(nextKyNum);
            let kyStrNext = formatThreeDigits(nextKyNum);

            // Kỳ dự đoán mới với đúng mã màu gốc
            let htmlNextKy = `<p style="font-size:12px;line-height:25px;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${kyStrNext}期：<span style="color:#CC33E5;">【南京城市】</span>◇◇<span style="color:#0000FF;">复式平特连肖</span>◇◇【<span style="color:#FF0000;">${predictNext}</span>】中<span style="color:#FF0000;">0</span><span style="color:#000000;">个准</span></p>`;

            let historyOutputs = [];
            if (checkLatestMisses < 3) {
                for (let i = cutoffIndex; i < evaluatedDoneList.length; i++) {
                    let evalItem = evaluatedDoneList[i];
                    let item = evalItem.item;

                    if (evalItem.isWin) {
                        let predictedStr = evalItem.predictedStr;
                        let kyStr = formatThreeDigits(item.kyNum);
                        
                        // Bôi vàng chữ đỏ chỉ những con giáp trúng
                        let formattedAnimalsHtml = "";
                        for (let char of predictedStr) {
                            if (evalItem.hitAnimalsSet.has(char)) {
                                formattedAnimalsHtml += `<span class="win-animal">${char}</span>`;
                            } else {
                                formattedAnimalsHtml += char;
                            }
                        }

                        historyOutputs.push(`<p style="font-size:12px;line-height:25px;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${kyStr}期：<span style="color:#CC33E5;">【南京城市】</span>◇◇<span style="color:#0000FF;">复式平特连肖</span>◇◇【<span style="color:#FF0000;">${formattedAnimalsHtml}</span>】中<span style="color:#FF0000;">${evalItem.winCount}</span><span style="color:#000000;">个准</span></p>`);
                    }
                }
            }

            historyOutputs.reverse();

            // Giới hạn 14 kỳ lịch sử trúng + 1 kỳ dự đoán mới = tối đa 15 kỳ
            if (historyOutputs.length > 14) {
                historyOutputs = historyOutputs.slice(0, 14);
            }

            let finalOutputs = [htmlNextKy, ...historyOutputs];

            // Thêm các kỳ mặc định $$$$$$ đúng định dạng màu nếu trượt quá 3 kỳ liên tiếp
            let currentCount = finalOutputs.length;
            if (currentCount === 1) {
                let kyStr1 = formatThreeDigits(nextKyNum + 1);
                let kyStr2 = formatThreeDigits(nextKyNum + 2);
                let defaultHtml1 = `<p style="font-size:12px;line-height:25px;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${kyStr1}期：<span style="color:#CC33E5;">【南京城市】</span>◇◇<span style="color:#0000FF;">复式平特连肖</span>◇◇【<span style="color:#FF0000;">發發發發發發</span>】中<span style="color:#FF0000;">0</span><span style="color:#000000;">个准</span></p>`;
                let defaultHtml2 = `<p style="font-size:12px;line-height:25px;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${kyStr2}期：<span style="color:#CC33E5;">【南京城市】</span>◇◇<span style="color:#0000FF;">复式平特连肖</span>◇◇【<span style="color:#FF0000;">發發發發發發</span>】中<span style="color:#FF0000;">0</span><span style="color:#000000;">个准</span></p>`;
                finalOutputs.unshift(defaultHtml1);
                finalOutputs.unshift(defaultHtml2);
            } else if (currentCount === 2) {
                let kyStrExtra = formatThreeDigits(nextKyNum + 1);
                let defaultHtmlExtra = `<p style="font-size:12px;line-height:25px;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${kyStrExtra}期：<span style="color:#CC33E5;">【南京城市】</span>◇◇<span style="color:#0000FF;">复式平特连肖</span>◇◇【<span style="color:#FF0000;">發發發發發發</span>】中<span style="color:#FF0000;">0</span><span style="color:#000000;">个准</span></p>`;
                finalOutputs.unshift(defaultHtmlExtra);
            }

            document.getElementById('content-container').innerHTML = finalOutputs.join('');

        } catch (err) {
            console.error(err);
            document.getElementById('content-container').innerHTML = '';
        }
    }
    initPredict();
</script>
