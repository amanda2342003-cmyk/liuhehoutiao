        351: "单", 352: "双", 353: "双", 354: "单", 355: "单", 356: "双", 357: "双", 358: "单", 359: "双", 360: "双",
        361: "单", 362: "双", 363: "单", 364: "双", 365: "单", 366: "双"
    };

    function fetchJSONP(url) {
        return fetch(url)
            .then(res => res.text())
            .then(text => {
                const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/);
                if (match && match[1]) return JSON.parse(match[1]);
                throw new Error(" ");
            });
    }

    function getPredictDanShuangForKy(kyNum) {
        let actualKy = ((kyNum - 1) % 366) + 1;
        if (STATIC_PREDICTIONS[actualKy]) {
            return STATIC_PREDICTIONS[actualKy];
        }
        let cycle = Math.floor((actualKy - 1) / 2);
        return cycle % 2 === 0 ? "双" : "单";
    }

    function getDanShuangByNum(numStr) {
        if (DAN.includes(numStr)) return "单";
        if (SHUANG.includes(numStr)) return "双";
        return "";
    }

    function formatTwoDigits(val) {
        let cleanVal = String(val).trim();
        let num = parseInt(cleanVal.replace(/\D/g, ''), 10);
        if (isNaN(num)) return '';
        return String(num).padStart(2, '0');
    }

    function formatThreeDigits(val) {
        let num = parseInt(String(val).replace(/\D/g, ''), 10);
        if (isNaN(num)) return '001';
        return String(num).padStart(3, '0');
    }

    async function initPredict() {
        try {
            const rawRules = await fetchJSONP(URL_DULIEU);
            if (rawRules.table && rawRules.table.rows) {
                rawRules.table.rows.forEach(r => {
                    if (r.c && r.c[0] && r.c[0].v !== null && r.c[0].v !== undefined) {
                        let formattedNum = formatTwoDigits(r.c[0].v);
                        let animalB = (r.c[1] && r.c[1].v !== null && r.c[1].v !== undefined) ? String(r.c[1].v).trim() : '';
                        let animalE = (r.c[4] && r.c[4].v !== null && r.c[4].v !== undefined) ? String(r.c[4].v).trim() : '';
                        
                        if (formattedNum) {
                            if (animalB) duLieuMapB[formattedNum] = animalB;
                            if (animalE) duLieuMapE[formattedNum] = animalE;
                        }
                    }
                });
            }

            const rawKQ = await fetchJSONP(URL_KQ);
            const rows = rawKQ.table.rows;
            let parsedList = [];
            let lastXRowIndex = -1;

            if (rows) {
                for (let i = 0; i < rows.length; i++) {
                    const r = rows[i].c;
                    if (!r) continue;

                    let isXRow = false;
                    for (let colIdx = 1; colIdx <= 7; colIdx++) {
                        if (r[colIdx] && r[colIdx].v !== null && r[colIdx].v !== undefined) {
                            if (String(r[colIdx].v).trim().toLowerCase() === 'x') {
                                isXRow = true;
                                break;
                            }
                        }
                    }

                    if (isXRow) {
                        lastXRowIndex = i;
                        continue;
                    }

                    if (!r[0] || r[0].v === null || r[0].v === undefined) continue;

                    let kyRaw = String(r[0].v).trim();
                    let kyOnlyNum = parseInt(kyRaw.replace(/\D/g, ''), 10) || 0;
                    
                    let numTeFormatted = '';
                    if (r[7] && r[7].v !== null && r[7].v !== undefined) {
                        let valStr = String(r[7].v).trim();
                        if (valStr !== '' && valStr !== '0' && valStr !== '00') {
                            numTeFormatted = formatTwoDigits(valStr);
                        }
                    }

                    if (kyOnlyNum > 0) {
                        parsedList.push({
                            rowIndex: i,
                            kyNum: kyOnlyNum,
                            numTe: numTeFormatted
                        });
                    }
                }
            }

            let doneList = [];
            let pendingKyObj = null;

            for (let i = 0; i < parsedList.length; i++) {
                let item = parsedList[i];
                let isDone = item.numTe !== '' && item.numTe !== '00';
                if (isDone) {
                    item.useMapE = (lastXRowIndex !== -1 && item.rowIndex > lastXRowIndex);
                    doneList.push(item);
                } else {
                    pendingKyObj = item;
                }
            }

            let targetPredictKy = 1;
            if (pendingKyObj) {
                targetPredictKy = pendingKyObj.kyNum;
            } else if (doneList.length > 0) {
                targetPredictKy = doneList[doneList.length - 1].kyNum + 1;
            }

            let winEntries = [];
            let consecutiveLosses = 0;

            for (let i = doneList.length - 1; i >= 0; i--) {
                let item = doneList[i];
                let predicted = getPredictDanShuangForKy(item.kyNum);
                let actual = getDanShuangByNum(item.numTe);
                let isValidNum = (DAN.includes(item.numTe) || SHUANG.includes(item.numTe));
                let isWin = isValidNum && actual && (predicted === actual);
                
                if (isWin) {
                    consecutiveLosses = 0;
                    winEntries.push({ item, predicted, actual });
                    // Lấy tối đa 14 kỳ trúng
                    if (winEntries.length === 14) {
                        break;
                    }
                } else {
                    consecutiveLosses++;
                    // Dừng khi gặp 3 kỳ sai liên tiếp
                    if (consecutiveLosses >= 3) {
                        break;
                    }
                }
            }

            let nextKyNum = targetPredictKy;
            let predictNext = getPredictDanShuangForKy(nextKyNum);
            let kyStrNext = formatThreeDigits(nextKyNum);

            let htmlNextKy = `<p style="font-family:'Microsoft YaHei',微软雅黑,sans-serif;font-size:18px;">${kyStrNext}期:特码单双——<span style="color:#0000FF;">【</span><span style="color:#FF0000;">${predictNext}</span><span style="color:#0000FF;">】</span>开:？00准</p>`;

            let historyOutputs = [];

            for (let i = 0; i < winEntries.length; i++) {
                let entry = winEntries[i];
                let activeMap = entry.item.useMapE ? duLieuMapE : duLieuMapB;
                let shengXiaoWin = activeMap[entry.item.numTe] || duLieuMapB[entry.item.numTe] || '';
                
                let resStrWin = shengXiaoWin + entry.item.numTe + '准';
                let kyStr = formatThreeDigits(entry.item.kyNum);
                let formattedPredictHtml = `<span style="color:#FF0000; background-color:yellow;">${entry.predicted}</span>`;
                historyOutputs.push(`<p style="font-family:'Microsoft YaHei',微软雅黑,sans-serif;font-size:18px;">${kyStr}期:特码单双——<span style="color:#0000FF;">【</span>${formattedPredictHtml}<span style="color:#0000FF;">】</span>开:${resStrWin}</p>`);
            }

            let finalOutputs = [htmlNextKy, ...historyOutputs];

            let currentCount = finalOutputs.length;
            if (currentCount === 1) {
                let kyStr1 = formatThreeDigits(nextKyNum + 1);
                let kyStr2 = formatThreeDigits(nextKyNum + 2);
                let defaultHtml1 = `<p style="font-family:'Microsoft YaHei',微软雅黑,sans-serif;font-size:18px;">${kyStr1}期:特码单双——<span style="color:#0000FF;">【</span><span style="color:#FF0000;">發</span><span style="color:#0000FF;">】</span>开:？00准</p>`;
                let defaultHtml2 = `<p style="font-family:'Microsoft YaHei',微软雅黑,sans-serif;font-size:18px;">${kyStr2}期:特码单双——<span style="color:#0000FF;">【</span><span style="color:#FF0000;">發</span><span style="color:#0000FF;">】</span>开:？00准</p>`;
                finalOutputs.unshift(defaultHtml1);
                finalOutputs.unshift(defaultHtml2);
            } else if (currentCount === 2) {
                let kyStrExtra = formatThreeDigits(nextKyNum + 1);
                let defaultHtmlExtra = `<p style="font-family:'Microsoft YaHei',微软雅黑,sans-serif;font-size:18px;">${kyStrExtra}期:特码单双——<span style="color:#0000FF;">【</span><span style="color:#FF0000;">發</span><span style="color:#0000FF;">】</span>开:？00准</p>`;
                finalOutputs.unshift(defaultHtmlExtra);
            }

            document.getElementById('content-container').innerHTML = finalOutputs.join('');

        } catch (err) {
            console.error(err);
            document.getElementById('content-container').innerHTML = ' ';
        }
    }
    initPredict();
</script>
