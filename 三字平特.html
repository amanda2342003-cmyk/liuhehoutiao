    function fetchJSONP(url) {
        return fetch(url)
            .then(res => res.text())
            .then(text => {
                const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/);
                if (match && match[1]) return JSON.parse(match[1]);
                throw new Error("Không thể đọc dữ liệu");
            });
    }

    function getPredictForKy(kyNum) {
        let actualKy = ((kyNum - 1) % 366) + 1;
        return STATIC_PREDICTIONS[actualKy] || "变色龙";
    }

    function formatTwoDigits(val) {
        let cleanVal = String(val).trim();
        let num = parseInt(cleanVal.replace(/\D/g, ''), 10);
        if (isNaN(num)) return '';
        return String(num).padStart(2, '0');
    }

    function formatThreeDigits(val) {
        let num = parseInt(String(val).replace(/\D/g, ''), 10);
        if (isNaN(num)) return '001';
        return String(num).padStart(3, '0');
    }

    async function initPredict() {
        try {
            const rawKQ = await fetchJSONP(URL_KQ);
            const rowsKQ = rawKQ.table ? rawKQ.table.rows : [];

            let hasX = false;
            if (rowsKQ) {
                for (let r of rowsKQ) {
                    if (r.c) {
                        for (let cell of r.c) {
                            if (cell && cell.v !== null && cell.v !== undefined) {
                                if (String(cell.v).toLowerCase().includes('x')) {
                                    hasX = true;
                                    break;
                                }
                            }
                        }
                    }
                    if (hasX) break;
                }
            }

            let animalColIndex = hasX ? 4 : 1;

            const rawRules = await fetchJSONP(URL_DULIEU);
            if (rawRules.table && rawRules.table.rows) {
                rawRules.table.rows.forEach(r => {
                    if (r.c && r.c[0] && r.c[0].v !== null && r.c[0].v !== undefined) {
                        let formattedNum = formatTwoDigits(r.c[0].v);
                        let animalCell = r.c[animalColIndex];
                        let animal = (animalCell && animalCell.v !== null && animalCell.v !== undefined) ? String(animalCell.v).trim() : '';
                        if (formattedNum && animal) {
                            duLieuMap[formattedNum] = animal;
                        }
                    }
                });
            }

            let parsedList = [];
            if (rowsKQ) {
                for (let i = 0; i < rowsKQ.length; i++) {
                    const r = rowsKQ[i].c;
                    if (!r || !r[0] || r[0].v === null || r[0].v === undefined) continue;
                    
                    let kyRaw = String(r[0].v).trim();
                    let kyOnlyNum = parseInt(kyRaw.replace(/\D/g, ''), 10) || 0;
                    
                    let orderedColumns = [7, 1, 2, 3, 4, 5, 6];
                    let numbersInDraw = [];

                    for (let colIdx of orderedColumns) {
                        if (r[colIdx] && r[colIdx].v !== null && r[colIdx].v !== undefined) {
                            let valStr = String(r[colIdx].v).trim();
                            if (valStr !== '' && valStr !== '0' && valStr !== '00') {
                                let formatted = formatTwoDigits(valStr);
                                if (formatted) {
                                    numbersInDraw.push(formatted);
                                }
                            }
                        }
                    }

                    if (kyOnlyNum > 0) {
                        parsedList.push({
                            kyNum: kyOnlyNum,
                            drawNumbers: numbersInDraw
                        });
                    }
                }
            }

            let doneList = [];
            let pendingKyObj = null;

            for (let i = 0; i < parsedList.length; i++) {
                let item = parsedList[i];
                let isDone = item.drawNumbers && item.drawNumbers.length > 0;
                if (isDone) {
                    doneList.push(item);
                } else {
                    pendingKyObj = item;
                }
            }

            let targetPredictKy = 1;
            if (pendingKyObj) {
                targetPredictKy = pendingKyObj.kyNum;
            } else if (doneList.length > 0) {
                targetPredictKy = doneList[doneList.length - 1].kyNum + 1;
            }

            let evaluatedDoneList = [];
            for (let i = 0; i < doneList.length; i++) {
                let item = doneList[i];
                let predictedIdiom = getPredictForKy(item.kyNum);
                let targetAnimal = IDIOM_ANIMAL_MAP[predictedIdiom] || "";
                
                let isWin = false;
                let winNumber = "";
                let winAnimal = "";

                for (let numStr of item.drawNumbers) {
                    let numInt = parseInt(numStr, 10);
                    if (numInt >= 1 && numInt <= 49) {
                        let mappedAnimal = duLieuMap[numStr] || '';
                        if (mappedAnimal === targetAnimal) {
                            isWin = true;
                            winNumber = numStr;
                            winAnimal = mappedAnimal;
                            break;
                        }
                    }
                }
                
                evaluatedDoneList.push({ item, isWin, predictedIdiom, winNumber, winAnimal });
            }

            let checkLatestMisses = 0;
            for (let i = evaluatedDoneList.length - 1; i >= 0; i--) {
                if (!evaluatedDoneList[i].isWin) {
                    checkLatestMisses++;
                } else {
                    break;
                }
            }

            let cutoffIndex = 0;
            if (checkLatestMisses < 3) {
                let consecutiveMisses = 0;
                for (let i = evaluatedDoneList.length - 1; i >= 0; i--) {
                    if (!evaluatedDoneList[i].isWin) {
                        consecutiveMisses++;
                        if (consecutiveMisses >= 3) {
                            cutoffIndex = i + 1;
                            break;
                        }
                    } else {
                        consecutiveMisses = 0;
                    }
                }
            } else {
                cutoffIndex = evaluatedDoneList.length;
            }

            let nextKyNum = targetPredictKy;
            let predictNext = getPredictForKy(nextKyNum);
            let kyStrNext = formatThreeDigits(nextKyNum);

            let htmlNextKy = `<p style="font-family:微软雅黑;font-size:16px;line-height:25px;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"><span style="color:#008080;">${kyStrNext}期:（谁入一件）</span><span style="color:#008000;">→三字平特→</span><span style="color:#FF0000;">（${predictNext}）</span><span style="color:#008080;">开：</span><span style="color:#808000;">？00准</span></p>`;

            let historyOutputs = [];
            if (checkLatestMisses < 3) {
                for (let i = cutoffIndex; i < evaluatedDoneList.length; i++) {
                    let evalItem = evaluatedDoneList[i];
                    let item = evalItem.item;

                    if (evalItem.isWin) {
                        let predictedIdiom = evalItem.predictedIdiom;
                        let kyStr = formatThreeDigits(item.kyNum);

                        let formattedPredict = `<span style="color:#FF0000;">（</span><span class="win-idiom">${predictedIdiom}</span><span style="color:#FF0000;">）</span>`;
                        
                        // Hiển thị đầy đủ Số trúng + Tên con giáp (ví dụ: 43狗)
                        let winText = `${evalItem.winNumber}${evalItem.winAnimal}`;
                        
                        historyOutputs.push(`<p style="font-family:微软雅黑;font-size:16px;line-height:25px;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"><span style="color:#008080;">${kyStr}期:（谁入一件）</span><span style="color:#008000;">→三字平特→</span>${formattedPredict}<span style="color:#008080;">开：</span><span style="color:#808000;">${winText}准</span></p>`);
                    }
                }
            }

            historyOutputs.reverse();

            if (historyOutputs.length > 14) {
                historyOutputs = historyOutputs.slice(0, 14);
            }

            let finalOutputs = [htmlNextKy, ...historyOutputs];

            let currentCount = finalOutputs.length;
            if (currentCount === 1) {
                let kyStr1 = formatThreeDigits(nextKyNum + 1);
                let kyStr2 = formatThreeDigits(nextKyNum + 2);
                let defaultHtml1 = `<p style="font-family:微软雅黑;font-size:16px;line-height:25px;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"><span style="color:#008080;">${kyStr1}期:（谁入一件）</span><span style="color:#008000;">→三字平特→</span><span style="color:#FF0000;">（發發發）</span><span style="color:#008080;">开：</span><span style="color:#808000;">？00准</span></p>`;
                let defaultHtml2 = `<p style="font-family:微软雅黑;font-size:16px;line-height:25px;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"><span style="color:#008080;">${kyStr2}期:（谁入一件）</span><span style="color:#008000;">→三字平特→</span><span style="color:#FF0000;">（發發發）</span><span style="color:#008080;">开：</span><span style="color:#808000;">？00准</span></p>`;
                finalOutputs.unshift(defaultHtml1);
                finalOutputs.unshift(defaultHtml2);
            } else if (currentCount === 2) {
                let kyStrExtra = formatThreeDigits(nextKyNum + 1);
                let defaultHtmlExtra = `<p style="font-family:微软雅黑;font-size:16px;line-height:25px;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"><span style="color:#008080;">${kyStrExtra}期:（谁入一件）</span><span style="color:#008000;">→三字平特→</span><span style="color:#FF0000;">（發發發）</span><span style="color:#008080;">开：</span><span style="color:#808000;">？00准</span></p>`;
                finalOutputs.unshift(defaultHtmlExtra);
            }

            document.getElementById('content-container').innerHTML = finalOutputs.join('');

        } catch (err) {
            console.error(err);
            document.getElementById('content-container').innerHTML = '';
        }
    }
    initPredict();
</script>
