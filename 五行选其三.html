    };

    function fetchJSONP(url) {
        return fetch(url)
            .then(res => res.text())
            .then(text => {
                const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/);
                if (match && match[1]) return JSON.parse(match[1]);
                throw new Error("Lỗi khi tải dữ liệu");
            });
    }

    function getPredictForKy(kyNum) {
        let key = ((kyNum - 1) % 366) + 1;
        return PREDICT_366[key];
    }

    function formatTwoDigits(val) {
        let cleanVal = String(val).trim();
        let num = parseInt(cleanVal.replace(/\D/g, ''), 10);
        if (isNaN(num)) return '';
        return String(num).padStart(2, '0');
    }

    function formatThreeDigits(val) {
        let num = parseInt(String(val).replace(/\D/g, ''), 10);
        if (isNaN(num)) return '001';
        return String(num).padStart(3, '0');
    }

    async function initPredict() {
        try {
            // Lấy dữ liệu quy tắc từ sheet DULIEU
            const rawRules = await fetchJSONP(URL_DULIEU);
            if (rawRules.table && rawRules.table.rows) {
                rawRules.table.rows.forEach(r => {
                    if (r.c && r.c[0] && r.c[0].v !== null && r.c[0].v !== undefined) {
                        let formattedNum = formatTwoDigits(r.c[0].v);
                        
                        // Cột B (生肖), Cột C (五行)
                        let animalB = (r.c[1] && r.c[1].v !== null && r.c[1].v !== undefined) ? String(r.c[1].v).trim() : '';
                        let elementC = (r.c[2] && r.c[2].v !== null && r.c[2].v !== undefined) ? String(r.c[2].v).trim() : '';
                        
                        // Cột E (生肖), Cột F (五行)
                        let animalE = (r.c[4] && r.c[4].v !== null && r.c[4].v !== undefined) ? String(r.c[4].v).trim() : '';
                        let elementF = (r.c[5] && r.c[5].v !== null && r.c[5].v !== undefined) ? String(r.c[5].v).trim() : '';
                        
                        if (formattedNum) {
                            duLieuMapB[formattedNum] = { animal: animalB, element: elementC };
                            duLieuMapF[formattedNum] = { animal: animalE, element: elementF };
                        }
                    }
                });
            }

            // Lấy dữ liệu kết quả từ sheet KQ_XIANGGANG
            const rawKQ = await fetchJSONP(URL_KQ);
            const rows = rawKQ.table.rows;
            let parsedList = [];
            let lastXRowIndex = -1;

            if (rows) {
                for (let i = 0; i < rows.length; i++) {
                    const r = rows[i].c;
                    if (!r) continue;

                    let isXRow = false;
                    for (let colIdx = 1; colIdx <= 7; colIdx++) {
                        if (r[colIdx] && r[colIdx].v !== null && r[colIdx].v !== undefined) {
                            if (String(r[colIdx].v).trim().toLowerCase() === 'x') {
                                isXRow = true;
                                break;
                            }
                        }
                    }

                    if (isXRow) {
                        lastXRowIndex = i;
                        continue;
                    }

                    if (!r[0] || r[0].v === null || r[0].v === undefined) continue;

                    let kyRaw = String(r[0].v).trim();
                    let kyOnlyNum = parseInt(kyRaw.replace(/\D/g, ''), 10) || 0;
                    
                    let numTeFormatted = '';
                    if (r[7] && r[7].v !== null && r[7].v !== undefined) {
                        let valStr = String(r[7].v).trim();
                        if (valStr !== '' && valStr !== '0' && valStr !== '00') {
                            numTeFormatted = formatTwoDigits(valStr);
                        }
                    }

                    if (kyOnlyNum > 0) {
                        parsedList.push({
                            rowIndex: i,
                            kyNum: kyOnlyNum,
                            numTe: numTeFormatted
                        });
                    }
                }
            }

            let doneList = [];
            let pendingKyObj = null;

            for (let i = 0; i < parsedList.length; i++) {
                let item = parsedList[i];
                let isDone = item.numTe !== '' && item.numTe !== '00';
                if (isDone) {
                    item.useMapF = (lastXRowIndex !== -1 && item.rowIndex > lastXRowIndex);
                    doneList.push(item);
                } else {
                    pendingKyObj = item;
                }
            }

            let targetPredictKy = 1;
            if (pendingKyObj) {
                targetPredictKy = pendingKyObj.kyNum;
            } else if (doneList.length > 0) {
                targetPredictKy = doneList[doneList.length - 1].kyNum + 1;
            }

            let winEntries = [];
            let consecutiveLosses = 0;

            for (let i = doneList.length - 1; i >= 0; i--) {
                let item = doneList[i];
                let predictedChoice = getPredictForKy(item.kyNum);
                
                let activeMap = item.useMapF ? duLieuMapF : duLieuMapB;
                let dataResult = activeMap[item.numTe] || duLieuMapB[item.numTe] || { animal: '', element: '' };

                let actualShengXiao = dataResult.animal;
                let actualElement = dataResult.element;

                // Kiểm tra xem Ngũ Hành thực tế có nằm trong chuỗi 3 dự đoán hay không
                let isWin = predictedChoice.includes(actualElement) && actualElement !== '';

                if (isWin) {
                    consecutiveLosses = 0;
                    winEntries.push({ 
                        item, 
                        predicted: predictedChoice, 
                        shengXiaoWin: actualShengXiao,
                        elementWin: actualElement 
                    });
                    if (winEntries.length === 14) {
                        break;
                    }
                } else {
                    consecutiveLosses++;
                    if (consecutiveLosses >= 3) {
                        break;
                    }
                }
            }

            let nextKyNum = targetPredictKy;
            let predictNext = getPredictForKy(nextKyNum);
            let kyStrNext = formatThreeDigits(nextKyNum);

            let htmlNextKy = `<p style="font-family:'Microsoft YaHei',微软雅黑,sans-serif;font-size:16px;line-height:1.2;margin:0;">${kyStrNext}期:<span style="color:#008080;">三行中特</span>→→<span style="color:#0000FF;">(${predictNext})</span>特码开:<span style="color:#FF0000;">？00</span>准！</p>`;

            let historyOutputs = [];

            for (let i = 0; i < winEntries.length; i++) {
                let entry = winEntries[i];
                let kyStr = formatThreeDigits(entry.item.kyNum);
                
                // Bôi vàng và chữ đỏ phần tử trúng
                let formattedPredictHtml = "";
                for (let char of entry.predicted) {
                    if (char === entry.elementWin) {
                        formattedPredictHtml += `<span class="win-digit">${char}</span>`;
                    } else {
                        formattedPredictHtml += char;
                    }
                }

                historyOutputs.push(`<p style="font-family:'Microsoft YaHei',微软雅黑,sans-serif;font-size:16px;line-height:1.2;margin:0;">${kyStr}期:<span style="color:#008080;">三行中特</span>→→<span style="color:#0000FF;">(${formattedPredictHtml})</span>特码开:<span style="color:#FF0000;">${entry.shengXiaoWin}${entry.item.numTe}</span>准！</p>`);
            }

            let finalOutputs = [htmlNextKy, ...historyOutputs];

            let currentCount = finalOutputs.length;
            if (currentCount === 1) {
                let kyStr1 = formatThreeDigits(nextKyNum + 1);
                let kyStr2 = formatThreeDigits(nextKyNum + 2);
                let defaultHtml1 = `<p style="font-family:'Microsoft YaHei',微软雅黑,sans-serif;font-size:16px;line-height:1.2;margin:0;">${kyStr1}期:<span style="color:#008080;">三行中特</span>→→<span style="color:#0000FF;">(發發)</span>特码开:<span style="color:#FF0000;">？00</span>准！</p>`;
                let defaultHtml2 = `<p style="font-family:'Microsoft YaHei',微软雅黑,sans-serif;font-size:16px;line-height:1.2;margin:0;">${kyStr2}期:<span style="color:#008080;">三行中特</span>→→<span style="color:#0000FF;">(發發)</span>特码开:<span style="color:#FF0000;">？00</span>准！</p>`;
                finalOutputs.unshift(defaultHtml1);
                finalOutputs.unshift(defaultHtml2);
            } else if (currentCount === 2) {
                let kyStrExtra = formatThreeDigits(nextKyNum + 1);
                let defaultHtmlExtra = `<p style="font-family:'Microsoft YaHei',微软雅黑,sans-serif;font-size:16px;line-height:1.2;margin:0;">${kyStrExtra}期:<span style="color:#008080;">三行中特</span>→→<span style="color:#0000FF;">(發發)</span>特码开:<span style="color:#FF0000;">？00</span>准！</p>`;
                finalOutputs.unshift(defaultHtmlExtra);
            }

            document.getElementById('content-container').innerHTML = finalOutputs.join('');

        } catch (err) {
            console.error(err);
            document.getElementById('content-container').innerHTML = ' ';
        }
    }
